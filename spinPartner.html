<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drill Session Manager — Offline Test</title>
<style>
  html, body { margin: 0; padding: 0; background: #10141c; min-height: 100vh; }
  #banner {
    background: #40261c; color: #ff6a39; font-family: sans-serif; font-size: 13px;
    padding: 8px 16px; text-align: center; border-bottom: 1px solid #ff6a39;
  }
  #error-box {
    display: none; background: #2a1010; color: #ff8080; font-family: monospace;
    font-size: 13px; padding: 16px; white-space: pre-wrap; border: 1px solid #ff5b5b; margin: 16px;
  }
</style>
</head>
<body>
<div id="banner">Offline test build — fully self-contained (no CDN, no network needed). Roster is saved to this browser's local storage only.</div>
<div id="root"></div>
<div id="error-box"></div>

<script>
  window.addEventListener('error', function(e) {
    var box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent = 'Error: ' + e.message + (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '');
  });
</script>

  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, shared: false };
    }
  };
